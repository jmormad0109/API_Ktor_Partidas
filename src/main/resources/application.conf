
ktor {
    application {
        modules = [ktor.ApplicationKt.module]
    }

    deployment {
        port = 8081
        host = "localhost"
    }
    urlPath{
        baseUrl = "http://localhost:8081"
        images = "images"
        files = "files"
    }

    database {
        url = "jdbc:mariadb://localhost:3306/dbPartida"
        driver = "org.mariadb.jdbc.Driver"
        username = "root"
        password = "root"
    }

    path{
        file = "upload/files"
        images = "upload/images"
    }
}